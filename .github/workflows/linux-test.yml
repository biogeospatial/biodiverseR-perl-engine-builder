name: Linux Test

on:
  workflow_dispatch:
    inputs:
      runtime_channel:
        description: Runtime dependency release channel
        required: true
        default: development
        type: choice
        options:
          - development
          - testing
          - stable
  pull_request:

jobs:

  perl:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            curl \
            libgsl-dev \
            gdal-bin \
            libgdal-dev \
            sqlite3 \
            libsqlite3-dev

      - name: Resolve runtime dependency release
        run: |
          python scripts/resolve_runtime_dependency.py \
            --channel "${{ inputs.runtime_channel || 'development' }}" \
            --platform linux \
            --github-env "$GITHUB_ENV"

      - name: Download runtime dependencies
        run: |
          archive="$RUNNER_TEMP/runtime-dependencies.zip"
          runtime_root="$RUNNER_TEMP/runtime-dependencies"

          curl --fail --location --retry 3 \
            "$RUNTIME_DEPENDENCY_URL" \
            --output "$archive"

          echo "$RUNTIME_DEPENDENCY_SHA256  $archive" | sha256sum --check
          mkdir -p "$runtime_root"
          unzip -q "$archive" -d "$runtime_root"

          perl_root=$(find "$runtime_root/perl" -mindepth 1 -maxdepth 1 \
            -type d -name 'perl-*' -print -quit)
          if [[ -z "$perl_root" || ! -x "$perl_root/bin/perl" ]]; then
            echo "The runtime dependency archive does not contain the expected Linux Perl runtime." >&2
            exit 1
          fi

          echo "PERL_ROOT=$perl_root" >> "$GITHUB_ENV"
          echo "$perl_root/bin" >> "$GITHUB_PATH"

          python scripts/configure_perl_runtime.py \
            --perl-root "$perl_root" \
            --runtime-root "$runtime_root" \
            --github-env "$GITHUB_ENV"

      - name: Validate bundled Perl dependencies
        run: |
          perl -V
          perl -MPDL -MPDL::GSL::CDF -e 1

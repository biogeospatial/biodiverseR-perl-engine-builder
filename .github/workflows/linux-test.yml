name: Linux Test

on:
  workflow_dispatch:
  pull_request:

jobs:
  perl:

    runs-on: ubuntu-22.04

    steps:

      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            curl \
            cpanminus \
            libgsl-dev \
            gdal-bin \
            libgdal-dev \
            sqlite3 \
            libsqlite3-dev

      - name: Cache perlbrew
        uses: actions/cache@v4
        with:
          path: ~/perl5/perlbrew
          key: perlbrew-5.38.4-ubuntu22-${{ runner.arch }}

      - name: Install perlbrew
        run: |
          curl -L https://install.perlbrew.pl | bash

      - name: Build Perl 5.38.4
        run: |
          source ~/perl5/perlbrew/etc/bashrc

          if ! perlbrew list | grep -q "perl-5.38.4"; then
            perlbrew install perl-5.38.4
          fi

          perlbrew use perl-5.38.4

          perl -V

      - name: Install cpanminus
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-5.38.4

          perl -MCPAN -e 'install App::cpanminus'

          cpanm --version

      - name: Install PDL dependencies
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-5.38.4

          cpanm --notest PDL
          cpanm -v --notest PDL::GSL::CDF

      - name: Clone Biodiverse
        run: |
          git clone --branch master --depth=1 \
            https://github.com/shawnlaffan/biodiverse.git

      - name: Check GDAL environment
        run: |
          gdalinfo --version
          gdal-config --version
          which gdal-config
          sqlite3 --version
          pkg-config --modversion gdal

      - name: Install Geo::GDAL::FFI
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-5.38.4

          cpanm --installdeps --notest Geo::GDAL::FFI
          cpanm --notest Geo::GDAL::FFI

      - name: Install Biodiverse dependencies
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-5.38.4

          cd biodiverse
          cpanm --installdeps --notest .

      - name: Check Geo::GDAL::FFI symbols
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-5.38.4

          perl -MGeo::GDAL::FFI -e '
            print "OGR_G_ConcaveHull exists: ";
            print defined(&Geo::GDAL::FFI::OGR_G_ConcaveHull) ? "YES\n" : "NO\n";
          '

      - name: Check GDB drivers
        run: |
          ogrinfo -

      - name: Run Biodiverse tests
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-5.38.4

          cd biodiverse
          prove -j4 -l t

      - name: Clone BiodiverseR
        run: |
          git clone --branch main --depth=1 \
            https://github.com/biogeospatial/BiodiverseR.git \
            BiodiverseR_src

      - name: Install BiodiverseR dependencies
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-5.38.4

          cd BiodiverseR_src/inst/perl
          cpanm --installdeps

name: macOS Runtime

on:
  workflow_call:
    inputs:
      build_type:
        required: true
        type: string
      runtime_channel:
        required: false
        default: development
        type: string
    outputs:
      macos_filename:
        value: ${{ jobs.perl.outputs.macos_filename }}
      macos_sha256:
        value: ${{ jobs.perl.outputs.macos_sha256 }}

permissions:
  contents: write

jobs:
  perl:
    outputs:
      macos_filename: ${{ steps.metadata.outputs.filename }}
      macos_sha256: ${{ steps.metadata.outputs.sha256 }}

    runs-on: macos-latest

    steps:

      - uses: actions/checkout@v7

      - name: Load runtime configuration
        run: |
          echo "BD_BRANCH=$(yq -r '.globals.biodiverse.branch' .github/runtime-config.yml)" >> "$GITHUB_ENV"

          echo "BDR_BRANCH=$(yq -r '.globals.biodiverser.branch' .github/runtime-config.yml)" >> "$GITHUB_ENV"

          echo "RUNTIME_TEST_PORT=$(yq -r '.globals.runtime.test_port' .github/runtime-config.yml)" >> "$GITHUB_ENV"

          echo "BD_NO_ALIEN_GTKSTACK=$(yq -r '.globals.build.no_alien_gtkstack' .github/runtime-config.yml)" >> "$GITHUB_ENV"

          echo "PKG_CONFIG_PATH=$(yq -r '.platforms.macos.pkg_config_path' .github/runtime-config.yml)" >> "$GITHUB_ENV"

          echo "PATH=$(yq -r '.platforms.macos.path' .github/runtime-config.yml)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Resolve runtime dependency release
        run: |
          python scripts/resolve_runtime_dependency.py \
            --channel "${{ inputs.runtime_channel }}" \
            --platform macos \
            --github-env "$GITHUB_ENV"

      - name: Download runtime dependencies
        run: |
          archive="$RUNNER_TEMP/runtime-dependencies.zip"
          runtime_root="$RUNNER_TEMP/runtime-dependencies"

          echo "Using runtime dependency release $RUNTIME_DEPENDENCY_VERSION ($RUNTIME_DEPENDENCY_CHANNEL)"

          curl --fail --location --retry 3 \
            "$RUNTIME_DEPENDENCY_URL" \
            --output "$archive"

          echo "$RUNTIME_DEPENDENCY_SHA256  $archive" | shasum -a 256 --check
          mkdir -p "$runtime_root"
          unzip -q "$archive" -d "$runtime_root"

          perl_root=$(find "$runtime_root/perl" -mindepth 1 -maxdepth 1 \
            -type d -name 'perl-*' -print -quit)
          if [[ -z "$perl_root" || ! -x "$perl_root/bin/perl" ]]; then
            echo "The runtime dependency archive does not contain the expected macOS Perl runtime." >&2
            exit 1
          fi

          echo "PERL_ROOT=$perl_root" >> "$GITHUB_ENV"
          echo "$perl_root/bin" >> "$GITHUB_PATH"

          python scripts/configure_perl_runtime.py \
            --perl-root "$perl_root" \
            --runtime-root "$runtime_root" \
            --github-env "$GITHUB_ENV"

      - name: Install cpanminus for packaging tools
        run: |
          if ! command -v cpanm >/dev/null 2>&1; then
            perl -MCPAN -e 'install App::cpanminus'
          fi

          cpanm --version

      - name: Validate bundled Perl dependencies
        run: |
          perl -V
          perl -MPDL -MPDL::GSL::CDF -MGeo::GDAL::FFI -e 1

      - name: Clone Biodiverse
        run: |
          git clone --branch $BD_BRANCH --depth=1 \
            https://github.com/shawnlaffan/biodiverse.git

      - name: Run Biodiverse tests
        run: |
          cd biodiverse
          prove -j4 -l t

      - name: Clone BiodiverseR
        run: |
          git clone --branch $BDR_BRANCH --depth=1 \
            https://github.com/biogeospatial/BiodiverseR.git

      - name: Run BiodiverseR tests
        run: |
          export PERL5LIB="${GITHUB_WORKSPACE}/biodiverse/lib:$PERL5LIB"

          cd BiodiverseR/inst/perl
          prove -j4 -l t

      - name: Install PAR::Packer
        run: |
          cpanm --notest PAR::Packer

          git clone --depth=1 https://github.com/shawnlaffan/perl-pp-autolink.git

          cd perl-pp-autolink
          perl Makefile.PL
          make
          make install

      - name: Build BiodiverseR executable
        run: |
          export PERL5LIB="${GITHUB_WORKSPACE}/biodiverse/lib:$PERL5LIB"

          which pp_autolink.pl

          cd BiodiverseR/inst/perl

          pp_autolink.pl -x -o BiodiverseR script/BiodiverseR

          ls -lah BiodiverseR

      - name: Test BiodiverseR runtime startup
        run: |
          cd BiodiverseR/inst/perl

          chmod +x BiodiverseR

          ./BiodiverseR daemon -l http://127.0.0.1:${RUNTIME_TEST_PORT} > runtime.log 2>&1 &
          SERVER_PID=$!

          sleep 10

          cat runtime.log

          curl --fail http://127.0.0.1:${RUNTIME_TEST_PORT}/api_key

          kill $SERVER_PID || true

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Test BiodiverseR runtime installation
        run: |
          rm -rf ~/Library/Application\ Support/BiodiverseR/runtime || true

          Rscript - <<'RSCRIPT'
          install.packages("pak", repos = "https://cloud.r-project.org")

          pak::pak(
            sprintf(
              "biogeospatial/BiodiverseR@%s",
              Sys.getenv("BDR_BRANCH")
            )
          )

          library(BiodiverseR)

          bd <- BiodiverseR::basedata$new(
            filename = system.file(
              "extdata",
              "example.bds",
              package = "BiodiverseR"
            )
          )

          stopifnot(bd$server_status())

          cat("Runtime installation and startup succeeded\n")
          RSCRIPT

      - name: Inspect executable
        run: |
          uname -m
          file BiodiverseR/inst/perl/BiodiverseR

      - name: Check build output
        run: |
          ls -lah BiodiverseR/inst/perl

          echo "Executable details:"
          file BiodiverseR/inst/perl/BiodiverseR || true

          echo "Contents:"
          find BiodiverseR/inst/perl -maxdepth 1 -type f

      - name: Get build version as SHA of BiodiverseR repo
        id: build_version
        run: |
          cd BiodiverseR
          v=$(git rev-parse --short HEAD)
          echo "BD_VERSION=${v}" >> "$GITHUB_OUTPUT"

      - name: Get release version
        if: inputs.build_type == 'release'
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - name: Package release artifact
        if: inputs.build_type == 'release'
        run: |
          cd BiodiverseR/inst/perl

          zip \
            BiodiverseR_macos_arm64_${VERSION}.zip \
            BiodiverseR

      - name: Generate release metadata
        if: inputs.build_type == 'release'
        id: metadata
        run: |
          SHA=$(shasum -a 256 BiodiverseR/inst/perl/BiodiverseR_macos_arm64_${VERSION}.zip | awk '{print $1}')

          echo "filename=BiodiverseR_macos_arm64_${VERSION}.zip" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        if: inputs.build_type == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: BiodiverseR_macos_arm64_${{ env.VERSION }}
          path: BiodiverseR/inst/perl/BiodiverseR_macos_arm64_${{ env.VERSION }}.zip

      - name: Upload release asset
        if: inputs.build_type == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            BiodiverseR/inst/perl/BiodiverseR_macos_arm64_${{ env.VERSION }}.zip


      - name: Upload CI artifact
        if: ${{ inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v7
        with:
          name: BiodiverseR_macos_arm64_${{ steps.build_version.outputs.BD_VERSION }}
          path: BiodiverseR/inst/perl/BiodiverseR

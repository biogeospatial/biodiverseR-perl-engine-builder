name: macOS Test

on:
  workflow_dispatch:
  pull_request:

env:
  PERL_CPANM_OPT: -M http://cpan.mirror.digitalpacific.com.au

jobs:
  perl:

    runs-on: macos-15-intel

    steps:

      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          brew install gsl

      - name: Check existing GIS tools
        run: |
          uname -m

          which gdalinfo || true
          gdalinfo --version || true

          which gdal-config || true
          gdal-config --version || true

          which sqlite3 || true
          sqlite3 --version || true

      - name: Cache perlbrew
        uses: actions/cache@v4
        with:
          path: ~/perl5/perlbrew
          key: perlbrew-5.38.4-${{ runner.os }}-${{ runner.arch }}

      - name: Install perlbrew
        run: |
          curl -L https://install.perlbrew.pl | bash

      - name: Build Perl 5.38.4
        run: |
          source ~/perl5/perlbrew/etc/bashrc

          if ! perlbrew list | grep -q "perl-5.38.4"; then
            perlbrew install perl-5.38.4
          fi

          perlbrew use perl-5.38.4

          perl -V

      - name: Install cpanminus
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-5.38.4

          perl -MCPAN -e 'install App::cpanminus'

          cpanm --version

      - name: Check CPAN resolution
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-5.38.4

          cpanm --info JSON::MaybeXS || true
          cpanm --info Text::CSV_XS || true

      - name: Install PDL dependencies
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-5.38.4

          cpanm --notest PDL
          cpanm -v --notest PDL::GSL::CDF

      - name: Clone Biodiverse
        run: |
          git clone --branch master --depth=1 \
            https://github.com/shawnlaffan/biodiverse.git

      - name: Install Geo::GDAL::FFI
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-5.38.4

          cpanm --installdeps --notest Geo::GDAL::FFI
          cpanm Geo::GDAL::FFI

      - name: Install Biodiverse dependencies
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-5.38.4

          cd biodiverse
          cpanm --installdeps --notest .

      - name: Run Biodiverse tests
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-5.38.4

          cd biodiverse
          prove -j4 -l t

      - name: Clone BiodiverseR
        run: |
          git clone --branch main --depth=1 \
            https://github.com/biogeospatial/BiodiverseR.git

      - name: Install BiodiverseR dependencies
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-5.38.4

          cd BiodiverseR/inst/perl
          cpanm --installdeps --notest .

      - name: Run BiodiverseR tests
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-5.38.4

          export PERL5LIB="${GITHUB_WORKSPACE}/biodiverse/lib"

          cd BiodiverseR/inst/perl
          prove -j4 -l t

      - name: Install PAR::Packer
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-5.38.4

          cpanm --notest PAR::Packer

      - name: Build BiodiverseR executable
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-5.38.4

          cd BiodiverseR/inst/perl

          pp -o BiodiverseR script/BiodiverseR

          ls -lah BiodiverseR

      - name: Inspect executable
        run: |
          uname -m
          file BiodiverseR/inst/perl/BiodiverseR

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiodiverseR_macos_x86_64
          path: BiodiverseR/inst/perl/BiodiverseR

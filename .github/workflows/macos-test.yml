name: macOS Test

on:
  workflow_dispatch:
  pull_request:

env:
  BD_BRANCH: master
  BD_NO_ALIEN_GTKSTACK: 1
  PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig
  PATH: /opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin

jobs:
  perl:

    runs-on: macos-latest

    steps:

      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          brew update
          brew install gsl
          brew install sqlite
          brew install gdal

      - name: Check GDAL
        run: |
          gdalinfo --version
          sqlite3

      - name: Cache perlbrew
        uses: actions/cache@v4
        with:
          path: ~/perl5/perlbrew
          key: perlbrew-5.38.4-${{ runner.os }}

      - name: Install perlbrew
        run: |
          curl -L https://install.perlbrew.pl | bash

      - name: Build Perl 5.38.4
        run: |
          source ~/perl5/perlbrew/etc/bashrc

          if ! perlbrew list | grep -q "perl-5.38.4"; then
            perlbrew install perl-5.38.4
          fi

          perlbrew use perl-5.38.4

          perl -V

      - name: Install cpanminus
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-5.38.4

          perl -MCPAN -e 'install App::cpanminus'

          cpanm --version

      - name: Install PDL dependencies
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-5.38.4

          cpanm --notest PDL
          cpanm -v --notest PDL::GSL::CDF

      - name: Clone Biodiverse
        run: |
          git clone --branch master --depth=1 \
            https://github.com/shawnlaffan/biodiverse.git

      - name: Install Geo::GDAL::FFI
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-5.38.4

          export ALIEN_INSTALL_TYPE=share
          export ALIEN_GDAL_CMAKE_ARGS="-DGDAL_ENABLE_DRIVER_PDF:BOOL=OFF -DGDAL_USE_CURL=OFF -DBUILD_APPS=OFF"

          cpanm --installdeps --notest Alien::gdal
          cpanm --notest -v Alien::gdal

          cpanm --installdeps --notest Geo::GDAL::FFI
          cpanm Geo::GDAL::FFI

      - name: Install Biodiverse dependencies
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-5.38.4

          cd biodiverse
          cpanm --installdeps --notest .

      - name: Run Biodiverse tests
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-5.38.4

          cd biodiverse
          prove -j4 -l t

      - name: Clone BiodiverseR
        run: |
          git clone --branch main --depth=1 \
            https://github.com/biogeospatial/BiodiverseR.git

      - name: Install BiodiverseR dependencies
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-5.38.4

          cd BiodiverseR/inst/perl
          cpanm --installdeps --notest .

      - name: Run BiodiverseR tests
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-5.38.4

          export PERL5LIB="${GITHUB_WORKSPACE}/biodiverse/lib"

          cd BiodiverseR/inst/perl
          prove -j4 -l t

      - name: Install PAR::Packer
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-5.38.4

          cpanm --notest PAR::Packer

          git clone --depth=1 https://github.com/shawnlaffan/perl-pp-autolink.git

          cd perl-pp-autolink
          perl Makefile.PL
          make
          make install


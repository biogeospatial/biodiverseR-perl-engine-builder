      - name: Build BiodiverseR executable
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-5.38.4

          export PERL5LIB="${GITHUB_WORKSPACE}/biodiverse/lib:$PERL5LIB"

          which pp_autolink.pl

          cd BiodiverseR/inst/perl

          pp_autolink.pl -x -o BiodiverseR script/BiodiverseR

          ls -lah BiodiverseR

      - name: Test BiodiverseR runtime startup
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-5.38.4

          cd BiodiverseR/inst/perl

          chmod +x BiodiverseR

          ./BiodiverseR daemon -l http://127.0.0.1:3001 > runtime.log 2>&1 &
          SERVER_PID=$!

          sleep 10

          cat runtime.log

          curl --fail http://127.0.0.1:3001/api_key

          kill $SERVER_PID || true

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Check R
        run: |
          which R
          which Rscript
          Rscript --version

      - name: Show PATH
        run: |
          echo "$PATH"
          which Rscript || true

      - name: Test BiodiverseR runtime installation
        run: |
          rm -rf ~/Library/Application\ Support/BiodiverseR/runtime || true

          Rscript - <<'RSCRIPT'
          install.packages("pak", repos = "https://cloud.r-project.org")

          pak::pak(
            "biogeospatial/BiodiverseR@101-generalise-runtime-startup-and-installation-across-platforms"
          )

          library(BiodiverseR)

          bd <- BiodiverseR::basedata$new()

          stopifnot(bd$server_status())

          cat("Runtime installation and startup succeeded\n")
          RSCRIPT

      - name: Inspect executable
        run: |
          uname -m
          file BiodiverseR/inst/perl/BiodiverseR

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiodiverseR_macos_arm64_${{ github.ref_name || 'dev' }}
          path: BiodiverseR/inst/perl/BiodiverseR


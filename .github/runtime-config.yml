# Runtime build configuration shared across all platforms.

globals:
  biodiverse:
    branch: "master"

  biodiverser:
    branch: "101-generalise-runtime-startup-and-installation-across-platforms"

  runtime:
    test_port: 3001

  build:
    no_alien_gtkstack: true

platforms:
  windows:
    perl:
      version: "5.38.4.1"

  macos:
    perl:
      version: "5.38.4"

    pkg_config_path: "/opt/homebrew/lib/pkgconfig"

    path: "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

  linux:
    perl:
      version: "5.38.4"
